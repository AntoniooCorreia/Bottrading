<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottrading · Painel</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f3; --surface:#ffffff; --surface-2:#f0efec; --border:#e4e3df; --grid:#eeede9;
  --text:#121211; --text-2:#55544f; --text-3:#85847d;
  --accent:#2563eb; --accent-soft:#e8effd;
  --pos:#14915a; --neg:#d23f3f; --warn:#d9930d;
  --c1:#2563eb; --c2:#e0702b; --c3:#14915a; --c4:#8b5cf6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f0f0e; --surface:#181817; --surface-2:#20201e; --border:#2b2b29; --grid:#232321;
    --text:#f1f0ec; --text-2:#c2c1b9; --text-3:#8d8c84;
    --accent:#5b8def; --accent-soft:#1d2840;
    --pos:#2fb878; --neg:#e5585a; --warn:#e7a52c;
    --c1:#5b8def; --c2:#e8844a; --c3:#2fb878; --c4:#a07cf7;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0f0e; --surface:#181817; --surface-2:#20201e; --border:#2b2b29; --grid:#232321;
  --text:#f1f0ec; --text-2:#c2c1b9; --text-3:#8d8c84;
  --accent:#5b8def; --accent-soft:#1d2840;
  --pos:#2fb878; --neg:#e5585a; --warn:#e7a52c;
  --c1:#5b8def; --c2:#e8844a; --c3:#2fb878; --c4:#a07cf7;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--border);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;padding:0 10px 14px;display:flex;align-items:center;gap:8px}
.brand .logo{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:14px}
nav a:hover{background:var(--surface-2);color:var(--text)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a svg{width:17px;height:17px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--text-3);padding:0 10px;display:flex;flex-direction:column;gap:8px}
main{min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;letter-spacing:-.015em;flex:1;min-width:180px}
.top .sub{font-size:13px;color:var(--text-3);font-weight:400;display:block;margin-top:2px;letter-spacing:0}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
select,input[type=number]{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;max-width:100%}
input[type=number]{width:96px}
.status{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--text-3)}
.dot.live{background:var(--pos);animation:pulse 1.6s infinite}
.dot.err{background:var(--neg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pos) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.status .rt{margin-left:auto;font-size:11px;color:var(--text-3);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 4px;letter-spacing:-.005em}
.card .hint{font-size:12px;color:var(--text-3);margin:0 0 12px}
.card-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-head>div:first-child{flex:1;min-width:180px}
.card-head .hint{margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--text-3);margin-top:1px}
.kpis.sm .kpi{padding:9px 12px}.kpis.sm .v{font-size:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid32{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--text-3)}.small{font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:500;color:var(--text-2);border-bottom:1px solid var(--border);padding:7px 8px;white-space:nowrap;font-size:12px}
table.t th.s{cursor:pointer;user-select:none}
table.t th.s:hover{color:var(--text)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t tr.sel td{background:var(--accent-soft)}
.num{text-align:right}
.scroll{overflow-x:auto}
main a{color:var(--accent);text-decoration:none}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--text-2);font-size:13px;padding:5px 11px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--text-2)}
.btn:hover{color:var(--text);background:var(--surface-2)}
.btn.icon{padding:6px 9px;line-height:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.badge.bad{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--neg)}
.badge.mid{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.neu{background:var(--surface-2);color:var(--text-2)}
/* calendario */
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-title{font-size:17px;font-weight:650;min-width:150px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:5px;margin-top:12px}
.cal .h{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;padding:0 4px 2px}
.day{border:1px solid var(--grid);border-radius:9px;min-height:78px;padding:6px 7px;display:flex;flex-direction:column;gap:2px;background:var(--surface);position:relative;min-width:0}
.day.out{opacity:.35}
.day.has{cursor:pointer}
.day.has:hover{outline:2px solid var(--accent);outline-offset:-1px}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.day .dn{font-size:11px;color:var(--text-3);font-weight:600}
.day .dv{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .dv.short{display:none}
.day .dt{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.wk{background:var(--surface-2);border-color:transparent}
.day.wk .dn{text-transform:uppercase;letter-spacing:.03em}
.day.we{background:transparent;border-style:dashed}
.year-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.mini{border:1px solid var(--grid);border-radius:10px;padding:10px;cursor:pointer;min-width:0}
.mini:hover{border-color:var(--accent)}
.mini .mh{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;text-transform:capitalize}
.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini .c{aspect-ratio:1;border-radius:3px;background:var(--grid)}
.mini .c.e{background:transparent}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);margin-top:10px;flex-wrap:wrap}
.legend .sw{width:14px;height:10px;border-radius:2px}
/* heatmap */
.hm td.c{text-align:center;font-size:12px;border-radius:0;min-width:52px;cursor:pointer}
.hm td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
/* graficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.14);display:none;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:5}
.lg{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin:0 0 6px;flex-wrap:wrap}
.lg span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:5px}
/* diario */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.chips button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.jday{margin:14px 0 4px;font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.ji{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--grid)}
.jic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--surface-2)}
.jb{min-width:0;flex:1}
.jh{display:flex;gap:8px;align-items:baseline}
.jk{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.jt{font-size:11px;color:var(--text-3);margin-left:auto}
.jm{font-size:14px;margin-top:1px;overflow-wrap:anywhere}
.jb ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--text-2)}
.jb li{margin:2px 0;overflow-wrap:anywhere}
.md p{margin:6px 0;color:var(--text-2)} .md .mh{font-weight:650;margin:12px 0 6px;font-size:14px}
.todo{list-style:none;margin:0;padding:0;font-size:13px}
.todo li{padding:6px 0;border-bottom:1px solid var(--grid);display:flex;gap:8px}
.todo li.done{color:var(--text-2)}
.todo .sec{font-weight:650;color:var(--text);border:0;padding-top:14px}
.box{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid var(--text-3);border-radius:4px;flex:none;font-size:10px;margin-top:2px}
li.done .box{background:var(--pos);color:#fff;border-color:var(--pos)}
.empty{padding:28px 8px;text-align:center;color:var(--text-3)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--text-2)}
.split{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-in{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;min-width:60px}
.bar-in>div{height:100%;border-radius:3px}
.mob-nav{display:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.year-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mob-nav{display:flex;position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;gap:2px;padding:8px 10px;scrollbar-width:none}
  .mob-nav a{white-space:nowrap;padding:7px 11px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:13px}
  .mob-nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  main{padding:16px 16px 50px}
  .grid2,.grid32{grid-template-columns:1fr}
  .year-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:620px){
  .cal{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .cal .wkc{display:none}
  .day{min-height:54px;padding:4px;border-radius:6px}
  .day .dv{font-size:11px}.day .dt{display:none}.day .dv.full{display:none}.day .dv.short{display:block}
  .kpi .v{font-size:20px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">B</span>Bottrading</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <label class="ctl" style="justify-content:space-between">Tema
        <select id="theme" onchange="setTheme(this.value)"><option value="">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
      <span id="rt">a ligar…</span>
    </div>
  </aside>
  <div style="min-width:0">
    <div class="mob-nav" id="mnav"></div>
    <main>
      <div class="top">
        <h1 id="ttl">Visão geral<span class="sub" id="ttlSub"></span></h1>
        <label class="ctl" id="pfCtl">Carteira <select id="pfSel" onchange="setPf(this.value)"></select></label>
        <label class="ctl">Conta <input type="number" id="acc" min="100" step="500" onchange="setAcc(this.value)"> €</label>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="stTxt">A carregar…</span></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
/* ---------- utilitarios ---------- */
const SB="https://ctyndeyumrvcwlxzdgnz.supabase.co/rest/v1/", KEY="sb_publishable_hMd_xtAGBa1zcJY30QRNIA_LupFPdfp";
const q=p=>fetch(SB+p,{headers:{apikey:KEY,Authorization:"Bearer "+KEY},cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(x,d=1)=>(+x).toLocaleString("pt-PT",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(x,d=1)=>x==null||isNaN(x)?"—":(x>0?"+":x<0?"−":"")+nf(Math.abs(x),d)+"%";
const rr=(x,d=2)=>x==null||isNaN(x)?"—":(x>0?"+":x<0?"−":"")+nf(Math.abs(x),d)+"R";
const eur=x=>(x<0?"−":x>0?"+":"")+Math.abs(x).toLocaleString("pt-PT",{maximumFractionDigits:0})+" €";
const cls=x=>x>0?"pos":x<0?"neg":"muted";
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DS=["seg","ter","qua","qui","sex","sáb","dom"];
const NM={nq:"NQ · US100",es:"S&P · US500",dow:"Dow · US30",dax:"DAX · GER40",ftse:"FTSE · UK100",nikkei:"Nikkei · JP225",estx:"Euro Stoxx · EU50",cac:"CAC · FRA40",asx:"ASX · AUS200",hsi:"Hang Seng · HK50"};
const nm=k=>NM[k]||k;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d);};
const fdate=s=>s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4);
function monday(s){const d=pd(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);}
function isoWeek(s){const d=pd(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const y=d.getFullYear();const j=new Date(y,0,4);return [y,1+Math.round(((d-j)/864e5-3+((j.getDay()+6)%7))/7)];}
function heat(x,max){ if(!x) return ""; const a=Math.min(1,Math.abs(x)/(max||1)); const p=Math.round(12+a*58); return `background:color-mix(in srgb,var(${x>0?"--pos":"--neg"}) ${p}%,var(--surface));${p>45?"color:#fff":""}`; }
function store(k,v){try{v===undefined?0:localStorage.setItem(k,v);return localStorage.getItem(k);}catch(e){return null;}}

/* ---------- estado ---------- */
const S={data:null,pf:store("bt_pf")||"ref",acc:+(store("bt_acc")||10000),route:"inicio",
  cal:{y:null,m:null,mode:"mes",mk:"all",idea:"all",sel:null},
  per:{y:null,view:"semanas"},
  tr:{y:"all",m:"all",mk:"all",idea:"all",res:"all",sort:"saida",dir:-1,page:0},
  tests:{f:"all",sel:null,mk:"nq",cal:{y:null,m:null,mode:"mes",sel:null}},
  j:"all"};

const ROUTES=[
  ["inicio","Visão geral",'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>'],
  ["calendario","Calendário",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
  ["periodos","Meses e semanas",'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
  ["trades","Trades",'<path d="M4 6h16M4 12h16M4 18h10"/>'],
  ["indices","Índices e estratégias",'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 5"/>'],
  ["testes","Testes",'<path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/>'],
  ["diario","Diário do agente",'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M9 9h6M9 13h6"/>'],
  ["plano","Plano e ideias",'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'],
];
function renderNav(){
  const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  document.getElementById("nav").innerHTML=ROUTES.map(([k,l,p])=>`<a href="#${k}" class="${S.route===k?"on":""}">${ic(p)}${l}</a>`).join("");
  document.getElementById("mnav").innerHTML=ROUTES.map(([k,l])=>`<a href="#${k}" class="${S.route===k?"on":""}">${l}</a>`).join("");
}
function setTheme(v){ if(v) document.documentElement.setAttribute("data-theme",v); else document.documentElement.removeAttribute("data-theme"); store("bt_theme",v); if(S.data) render(); }
function setPf(v){S.pf=v;store("bt_pf",v);S.cal.y=null;S.per.y=null;S.tr.page=0;render();}
function setAcc(v){S.acc=Math.max(100,+v||10000);store("bt_acc",S.acc);render();}

/* ---------- dados da carteira ---------- */
function portfolios(){const d=S.data; if(!d) return []; return [d.portfolio?{id:"ref",...d.portfolio,ref:true}:null,...d.extra.map(p=>({id:p.label,...p}))].filter(Boolean);}
function curPf(){const L=portfolios(); return L.find(p=>p.id===S.pf)||L[0]||null;}
function pfName(P){return (P.aviso?"⚠ ":"")+(P.label?P.label+" · ":"")+(P.ref?"Referência":"Carteira")+" ("+(P.markets&&P.markets.length?P.markets.length:new Set(P.por_indice.map(r=>r.indice)).size)+" índices)";}
/* agrega trades por dia de saida: {date:{r,n,w,list}} */
function dayMap(trades){const m={}; for(const t of trades){const k=t[1]; const o=m[k]||(m[k]={r:0,n:0,w:0,list:[]}); o.r+=t[4]; o.n++; if(t[4]>0)o.w++; o.list.push(t);} return m;}
function filtTrades(P,mk,idea){return (P.trades||[]).filter(t=>(mk==="all"||t[2]===mk)&&(idea==="all"||t[3]===idea));}
function group(dm,fn){const g={}; for(const [k,v] of Object.entries(dm)){const kk=fn(k); const o=g[kk]||(g[kk]={r:0,n:0,w:0,days:0,pd:0}); o.r+=v.r;o.n+=v.n;o.w+=v.w;o.days++; if(v.r>0)o.pd++;} return g;}
function stats(trades){const n=trades.length, w=trades.filter(t=>t[4]>0).length, r=trades.reduce((a,t)=>a+t[4],0);
  const gw=trades.filter(t=>t[4]>0).reduce((a,t)=>a+t[4],0), gl=-trades.filter(t=>t[4]<0).reduce((a,t)=>a+t[4],0);
  return {n,w,r,wr:n?w/n*100:0,avg:n?r/n:0,pf:gl?gw/gl:null,best:n?Math.max(...trades.map(t=>t[4])):0,worst:n?Math.min(...trades.map(t=>t[4])):0};}

/* ---------- componentes ---------- */
const kpi=(k,v,s="",c="")=>`<div class="kpi"><div class="k">${k}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`;
function seg(opts,cur,fn){return `<div class="seg">${opts.map(([k,l])=>`<button class="${k===cur?"on":""}" onclick="${fn}('${k}')">${l}</button>`).join("")}</div>`;}
function sel(id,opts,cur,fn){return `<select id="${id}" onchange="${fn}(this.value)">${opts.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(cur)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<1.5?1:n<3?2:n<7?5:10)*p;}
const CH={};
/* linhas: series=[{name,color,pts:[[label,value]]}] */
function lineChart(id,series,o={}){
  const W=o.w||820,H=o.h||260,L=46,R=14,T=10,B=26; const all=series.flatMap(s=>s.pts); if(!all.length) return `<div class="empty">Sem dados</div>`;
  const xs=[...new Set(all.map(p=>p[0]))].sort(); const xt=xs.map(x=>pd(x).getTime()); const xi=Object.fromEntries(xs.map((x,i)=>[x,i]));
  let lo=Math.min(0,...all.map(p=>p[1])),hi=Math.max(0,...all.map(p=>p[1])); if(hi===lo)hi=lo+1; const st=niceStep((hi-lo)/5); lo=lo>-0.1*st?0:Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const t0=xt[0],t1=xt[xt.length-1]||t0+1; const X=i=>L+(t1===t0?0:(xt[i]-t0)/(t1-t0))*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g=""; for(let v=lo;v<=hi+1e-9;v+=st) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--text-3)">${nf(v,st<1?1:0)}${o.unit||""}</text>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--text-3)" stroke-width=".8"/>`;
  const yrs=[...new Set(xs.map(x=>x.slice(0,4)))]; const every=Math.ceil(yrs.length/10);
  yrs.forEach((y,j)=>{ if(j%every) return; const tx=new Date(+y,0,1).getTime(); if(tx<t0) return; const x=L+(tx-t0)/(t1-t0)*(W-L-R); g+=`<line x1="${x}" x2="${x}" y1="${H-B}" y2="${H-B+4}" stroke="var(--text-3)"/><text x="${x}" y="${H-6}" font-size="11" fill="var(--text-3)" text-anchor="middle">${y}</text>`; });
  const paths=series.map(s=>{ const d=s.pts.map((p,j)=>(j?"L":"M")+X(xi[p[0]]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(""); return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`; }).join("");
  CH[id]={series,xs,xt,xi,X,Y,W,H,L,R,t0,t1,unit:o.unit||"",fmt:o.fmt};
  const lg=series.length>1?`<div class="lg">${series.map(s=>`<span style="--c:${s.color}">${esc(s.name)}</span>`).join("")}</div>`:"";
  return lg+`<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" onmousemove="lineHover(event,'${id}')" onmouseleave="hideTip('${id}')">${g}${paths}<line class="hv" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--text-3)" stroke-dasharray="3 3" style="display:none"/></svg></div>`;
}
function lineHover(e,id){const c=CH[id]; const sv=e.currentTarget; const r=sv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*c.W;
  const tt=c.t0+(x-c.L)/(c.W-c.L-c.R)*(c.t1-c.t0); let i=0; while(i<c.xt.length-1&&c.xt[i+1]<=tt) i++; const lab=c.xs[i];
  const ln=sv.querySelector(".hv"); ln.style.display=""; ln.setAttribute("x1",c.X(i)); ln.setAttribute("x2",c.X(i));
  const rows=c.series.map(s=>{let v=null; for(const p of s.pts){ if(p[0]<=lab) v=p[1]; else break;} return v==null?"":`<div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:5px"></span>${esc(s.name)}: <b>${c.fmt?c.fmt(v):nf(v,1)+c.unit}</b></div>`;}).join("");
  showTip(e,`<div class="muted">${fdate(lab)}</div>${rows}`);}
/* barras: items=[{label,v,sub}] */
function barChart(id,items,o={}){
  const W=o.w||820,H=o.h||220,L=46,R=10,T=10,B=26; if(!items.length) return `<div class="empty">Sem dados</div>`;
  let lo=Math.min(0,...items.map(i=>i.v)),hi=Math.max(0,o.goal||0,...items.map(i=>i.v)); if(hi===lo)hi=1; const st=niceStep((hi-lo)/5); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B), bw=(W-L-R)/items.length;
  let g=""; for(let v=lo;v<=hi+1e-9;v+=st) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--text-3)">${nf(v,st<1?1:0)}${o.unit||""}</text>`;
  if(o.goal) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.goal)}" y2="${Y(o.goal)}" stroke="var(--warn)" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(o.goal)-4}" text-anchor="end" font-size="11" fill="var(--warn)">objetivo ${o.goal}${o.unit||""}</text>`;
  const every=Math.ceil(items.length/(o.maxLabels||16));
  g+=items.map((it,i)=>{const x=L+i*bw+bw*.15,w=Math.max(1,bw*.7),y=Y(Math.max(0,it.v)),h=Math.abs(Y(it.v)-Y(0));
    const col=o.goal&&it.v>=o.goal?"var(--pos)":it.v>=0?"var(--c1)":"var(--neg)";
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(1,h)}" rx="2" fill="${col}" data-i="${i}" ${o.click?`style="cursor:pointer" onclick="${o.click}(${i})"`:""}/>`+(i%every?"":`<text x="${x+w/2}" y="${H-6}" font-size="11" fill="var(--text-3)" text-anchor="middle">${esc(it.label)}</text>`);}).join("");
  CH[id]={items,unit:o.unit||""};
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" onmousemove="barHover(event,'${id}')" onmouseleave="hideTip('${id}')">${g}<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--text-3)" stroke-width=".8"/></svg></div>`;
}
function barHover(e,id){const i=e.target.dataset&&e.target.dataset.i; if(i==null){hideTip();return;} const it=CH[id].items[+i]; showTip(e,`<div class="muted">${esc(it.full||it.label)}</div><b class="${cls(it.v)}">${nf(it.v,2)}${CH[id].unit}</b>${it.sub?`<div class="muted">${it.sub}</div>`:""}`);}
function showTip(e,h){const t=document.getElementById("tip"); t.innerHTML=h; t.style.display="block"; const w=t.offsetWidth; let x=e.pageX+14; if(x+w>window.scrollX+innerWidth-8) x=e.pageX-w-14; t.style.left=x+"px"; t.style.top=(e.pageY+12)+"px";}
function hideTip(id){document.getElementById("tip").style.display="none"; if(id){const l=document.querySelector("#"+id+" .hv"); if(l) l.style.display="none";}}

/* ---------- calendario generico ---------- */
/* dm = {date:{r,n,w,list?}}, st = estado {y,m,mode,sel}, ns = nome do estado global (para callbacks), unit "%" ou "R" */
function calendar(dm,st,ns,unit){
  const keys=Object.keys(dm).sort(); if(!keys.length) return `<div class="empty">Sem trades com estes filtros.</div>`;
  if(st.y==null){ const cnt={}; for(const k of keys){const mm=k.slice(0,7); cnt[mm]=(cnt[mm]||0)+dm[k].n;}
    const ms=Object.keys(cnt).sort(); const l=[...ms].reverse().find(mm=>cnt[mm]>=10)||ms[ms.length-1]; st.y=+l.slice(0,4); st.m=+l.slice(5,7)-1;}
  const years=[...new Set(keys.map(k=>+k.slice(0,4)))];
  const f=v=>unit==="%"?pc(v,2):rr(v,2);
  const maxAbs=Math.max(...Object.values(dm).map(v=>Math.abs(v.r)))*0.6||1;
  const nav=`<div class="cal-nav">
    <button class="btn icon" onclick="calMove('${ns}',-1)" aria-label="Anterior">‹</button>
    <div class="cal-title">${st.mode==="mes"?MES[st.m]+" "+st.y:st.y}</div>
    <button class="btn icon" onclick="calMove('${ns}',1)" aria-label="Seguinte">›</button>
    ${sel(ns+"Y",years.map(y=>[y,y]),st.y,`(v=>calSet('${ns}','y',+v))`)}
    ${st.mode==="mes"?sel(ns+"M",MES.map((m,i)=>[i,m]),st.m,`(v=>calSet('${ns}','m',+v))`):""}
    <span style="flex:1"></span>${seg([["mes","Mês"],["ano","Ano"]],st.mode,`(v=>calSet('${ns}','mode',v))`)}</div>`;
  if(st.mode==="ano"){
    let h=`<div class="year-grid">`; let yr=0,yn=0;
    for(let m=0;m<12;m++){ const first=new Date(st.y,m,1), off=(first.getDay()+6)%7, nd=new Date(st.y,m+1,0).getDate(); let tot=0,n=0,cells="";
      for(let i=0;i<off;i++) cells+=`<div class="c e"></div>`;
      for(let d=1;d<=nd;d++){const k=st.y+"-"+pad(m+1)+"-"+pad(d); const v=dm[k]; if(v){tot+=v.r;n+=v.n;} cells+=`<div class="c" style="${v?heat(v.r,maxAbs):""}" title="${fdate(k)}${v?": "+f(v.r)+" · "+v.n+" trades":""}"></div>`;}
      yr+=tot; yn+=n;
      h+=`<div class="mini" onclick="calSet('${ns}','m',${m});calSet('${ns}','mode','mes')"><div class="mh"><span>${MES[m]}</span><span class="${cls(tot)}">${n?f(tot):"—"}</span></div><div class="mg">${cells}</div><div class="small muted" style="margin-top:6px">${n} trades</div></div>`;}
    h+=`</div>`;
    return nav+`<div class="small" style="margin-top:8px">Total do ano: <b class="${cls(yr)}">${f(yr)}</b>${unit==="%"?` · <b class="${cls(yr)}">${eur(yr/100*S.acc)}</b>`:""} · ${yn} trades</div>`+h+legend(maxAbs,f);
  }
  const first=new Date(st.y,st.m,1), off=(first.getDay()+6)%7, start=new Date(st.y,st.m,1-off);
  let h=`<div class="cal">${DS.map(d=>`<div class="h">${d}</div>`).join("")}<div class="h wkc">semana</div>`;
  let mt=0,mn=0,mw=0,days=0,pdays=0,best=null,worst=null;
  const nweeks=Math.ceil((off+new Date(st.y,st.m+1,0).getDate())/7);
  for(let w=0;w<nweeks;w++){ let wt=0,wn=0; const wd0=new Date(start); wd0.setDate(start.getDate()+w*7);
    for(let d=0;d<7;d++){ const dt=new Date(start); dt.setDate(start.getDate()+w*7+d); const k=ymd(dt), v=dm[k], out=dt.getMonth()!==st.m;
      if(v){wt+=v.r;wn+=v.n; if(!out){mt+=v.r;mn+=v.n;mw+=v.w;days++; if(v.r>0)pdays++; if(!best||v.r>best[1])best=[k,v.r]; if(!worst||v.r<worst[1])worst=[k,v.r];}}
      h+=`<div class="day ${out?"out":""} ${d>4?"we":""} ${v?"has":""} ${st.sel===k?"sel":""}" ${v?`onclick="calSet('${ns}','sel','${k}')"`:""} style="${v&&!out?heat(v.r,maxAbs):""}">
        <span class="dn">${dt.getDate()}</span>${v?`<span class="dv full">${f(v.r)}</span><span class="dv short">${(v.r>0?"+":v.r<0?"−":"")+nf(Math.abs(v.r),1)}</span><span class="dt">${v.n} trade${v.n>1?"s":""}${unit==="%"?" · "+eur(v.r/100*S.acc):""}</span>`:""}</div>`;}
    const [iy,iw]=isoWeek(ymd(wd0));
    h+=`<div class="day wk wkc"><span class="dn">S${iw}</span>${wn?`<span class="dv ${cls(wt)}">${f(wt)}</span><span class="dt">${wn} trade${wn>1?"s":""}</span>`:`<span class="dt muted">sem trades</span>`}</div>`;
  }
  h+=`</div>`;
  const tiles=`<div class="kpis sm" style="margin-top:14px">${kpi("Resultado do mês",f(mt),unit==="%"?eur(mt/100*S.acc):"",cls(mt))}${kpi("Trades",mn,mn?`${nf(mw/mn*100,0)}% ganhas`:"")}${kpi("Dias com trades",days,days?`${pdays} positivos · ${days-pdays} negativos`:"")}${kpi("Melhor / pior dia",best?`<span class="${cls(best[1])}">${f(best[1])}</span>`:"—",worst?`pior <span class="${cls(worst[1])}">${f(worst[1])}</span> (${fdate(worst[0]).slice(0,5)})`:"")}</div>`;
  return nav+tiles+h+legend(maxAbs,f);
}
function legend(maxAbs,f){return `<div class="legend">Perda<span class="sw" style="${heat(-maxAbs,maxAbs)}"></span><span class="sw" style="${heat(-maxAbs/3,maxAbs)}"></span><span class="sw" style="background:var(--grid)"></span><span class="sw" style="${heat(maxAbs/3,maxAbs)}"></span><span class="sw" style="${heat(maxAbs,maxAbs)}"></span>Ganho · cor mais forte = dia maior (até ${f(maxAbs)})</div>`;}
function nsState(ns){return ns==="cal"?S.cal:S.tests.cal;}
function calSet(ns,k,v){const st=nsState(ns); st[k]=v; if(k!=="sel") st.sel=null; render();}
function calMove(ns,d){const st=nsState(ns); if(st.mode==="ano") st.y+=d; else {st.m+=d; if(st.m<0){st.m=11;st.y--;} if(st.m>11){st.m=0;st.y++;}} st.sel=null; render();}

function tradeTable(list,unit="%"){
  if(!list.length) return `<div class="empty">Sem trades.</div>`;
  return `<div class="scroll"><table class="t"><thead><tr><th>Entrada</th><th>Saída</th><th>Índice</th><th>Estratégia</th><th class="num">Dias</th><th class="num">Resultado</th>${unit==="%"?`<th class="num">€</th>`:""}</tr></thead><tbody>
    ${list.map(t=>`<tr><td>${fdate(t[0])}</td><td>${fdate(t[1])}</td><td>${esc(nm(t[2]))}</td><td><code>${esc(t[3])}</code></td><td class="num">${Math.round((pd(t[1])-pd(t[0]))/864e5)}</td><td class="num"><b class="${cls(t[4])}">${unit==="%"?pc(t[4],2):rr(t[4],2)}</b></td>${unit==="%"?`<td class="num ${cls(t[4])}">${eur(t[4]/100*S.acc)}</td>`:""}</tr>`).join("")}
  </tbody></table></div>`;
}

function openYear(i){const P=curPf(); const y=+Object.keys(P.por_ano)[i]; S.cal.y=y; S.cal.mode="ano"; location.hash="#calendario";}

function vCalendario(){

  const T=filtTrades(P,S.cal.mk,S.cal.idea); const dm=dayMap(T);
  const mks=[...new Set((P.trades||[]).map(t=>t[2]))], ids=[...new Set((P.trades||[]).map(t=>t[3]))];
  let det="";

    det=`<div class="card" id="tdet"><div class="card-head"><div><h2>${cat[S.tests.sel.replace(/ \(.*\)$/,"")]?"#"+cat[S.tests.sel.replace(/ \(.*\)$/,"")].n+" · ":""}<code style="font-size:14px">${esc(S.tests.sel)}</code></h2>
      <p class="hint">Período mostrado: ${PER[r.period]}. Resultados em R (1R = 1% da conta), já com custos de CFD.</p></div>
      ${seg(pers.map(p=>[p,PER[p].split(" ")[0]]),r.period,"(v=>{S.tests.per=v;S.tests.cal.y=null;render()})")}<button class="btn" onclick="S.tests.sel=null;render()">Fechar</button></div>
      <div class="kpis sm">${["nq","es","dow"].map(k=>{const m=r.markets[k]||{}; return kpi(nm(k)+(k==="nq"?" (o teu)":""),m.n?rr(m.meanR,3):"—",m.n?`${m.n} trades · ${nf(m["win%"],0)}% ganhas · t ${nf(m.t,2)} · ${rr(m["R/mes"],2)}/mês`:"",cls(m.meanR));}).join("")}${kpi("Juntos",nf(r.pooled.t,2),"t-stat conjunto · fasquia 3,0")}</div>
      <h2 style="margin-top:6px">Curva acumulada</h2>${lineChart("teq",ser,{unit:"R",h:230,fmt:v=>rr(v,1)})}

  </tbody></table></div></div>`;

/* diario */
const JK={demo:["📈","Conta demo"],inicio:["▶","Início"],estado:["⋯","A fazer"],ideia:["💡","Ideia nova"],teste:["🧪","Teste"],mudanca:["🔧","Mudança"],erro:["⚠️","Erro"],fim:["🏁","Fim de sessão"]};
function vDiario(){
  const log=S.data.log; const F={all:"Tudo",demo:"Conta demo",teste:"Testes",ideia:"Ideias",mudanca:"Mudanças",fim:"Fins de sessão",erro:"Erros"};
  const L=log.filter(e=>S.j==="all"?e.kind!=="estado":e.kind===S.j);
  let h="",lastDay="";
  for(const e of L){const d=new Date(e.at); const day=d.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"});
    if(day!==lastDay){h+=`<div class="jday">${day}</div>`; lastDay=day;}
    let msg=e.message, det=Array.isArray(e.details)?e.details:[]; if(!det.length&&msg.includes(" | ")){const p=msg.split(" | "); msg=p.shift(); det=p;}
    const [ic,lab]=JK[e.kind]||["•",e.kind];
    h+=`<div class="ji"><div class="jic">${ic}</div><div class="jb"><div class="jh"><span class="jk">${lab}</span><span class="jt">${d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})}</span></div><div class="jm">${esc(msg)}</div>${det.length?`<ul>${det.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}</div></div>`;}
  return `<div class="card"><h2>Diário do agente</h2><p class="hint">O que o agente pensou, testou e mudou, do mais recente para o mais antigo.</p>
    <div class="chips">${Object.entries(F).map(([k,v])=>`<button class="${S.j===k?"on":""}" onclick="S.j='${k}';render()">${v} ${k==="all"?"":log.filter(e=>e.kind===k).length}</button>`).join("")}</div>${h||`<div class="empty">Sem registos.</div>`}</div>`;
}

/* plano */
function md(t){ const out=[]; const L=t.split("\n"); let i=0;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  while(i<L.length){const l=L[i];
    if(/^\s*\|/.test(l)){const rows=[]; while(i<L.length&&/^\s*\|/.test(L[i])){ if(!/^\s*\|[\s|:-]+\|\s*$/.test(L[i])) rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); i++;}
      out.push(`<div class="scroll"><table class="t">${rows.map((r,j)=>`<tr>${r.map(c=>j?`<td>${inl(c)}</td>`:`<th>${inl(c)}</th>`).join("")}</tr>`).join("")}</table></div>`); continue;}
    if(/^#+\s/.test(l)) out.push(`<div class="mh">${inl(l.replace(/^#+\s/,""))}</div>`);
    else if(/^\s*-\s/.test(l)) out.push(`<p>• ${inl(l.replace(/^\s*-\s/,""))}</p>`);
    else if(l.trim()) out.push(`<p>${inl(l)}</p>`);
    i++;}
  return out.join("");}
function vPlano(){
  const d=S.data; const sm=d.summary.split(/\nLeitura honesta/); const reading=sm[1]?"Leitura honesta"+sm[1]:"";
  let ls=null; const todo=d.todo.map(t=>{const h=t.section!==ls?`<li class="sec">${esc(t.section||"")}</li>`:""; ls=t.section; return h+`<li class="${t.done?"done":""}"><span class="box">${t.done?"✓":""}</span><span>${esc(t.text||"")}</span></li>`;}).join("");
  return `<div class="card"><h2>Leitura do agente</h2><p class="hint">O que o agente conclui de tudo até agora.</p><div class="md">${md(reading||d.summary)}</div></div>
    <div class="grid2"><div class="card"><h2>Plano de testes</h2><p class="hint">O que já correu (✓) e o que falta.</p><ul class="todo">${todo}</ul></div>
    <div><div class="card"><h2>Como ler isto</h2><div class="md small">
      <p><b>R</b> = quanto arriscas por trade. Com 1% de risco, +1R = +1% da conta; −1R = levaste o stop. Já inclui spread e financiamento do CFD.</p>
      <p><b>2019–2024</b> serve para escolher. <b>2012–2018</b> é um teste às cegas. <b>Holdout (2025–2026)</b> só se abre uma vez por variante que passe.</p>
      <p><b>Para passar:</b> pelo menos 60 trades em cada índice, média positiva no NQ, no S&amp;P e no Dow, e t-stat conjunto ≥ 3,0.</p>
      <p><b>Carteira:</b> várias estratégias em 10 índices, no máximo 3 trades abertas, 1 por região, e pára no mês em que perder 3%.</p></div></div>
      ${d.holdoutLog.trim()?`<div class="card"><h2>Registo do holdout</h2><pre class="small" style="white-space:pre-wrap;margin:0">${esc(d.holdoutLog.trim())}</pre></div>`:""}</div></div>
    <div class="card"><details><summary style="cursor:pointer;font-weight:650">Ideias do agente (registadas antes de correr)</summary><div class="md" style="margin-top:8px">${md(d.ideas)}</div></details></div>`;
}

/* ---------- render ---------- */
const VIEWS={inicio:vInicio,calendario:vCalendario,periodos:vPeriodos,trades:vTrades,indices:vIndices,testes:vTestes,diario:vDiario,plano:vPlano};
const SUBS={inicio:"Resumo da carteira escolhida",calendario:"Resultado de cada dia, semana e mês",periodos:"Todos os meses e todas as semanas",trades:"Lista completa, com filtros",indices:"De onde vem o resultado",testes:"Catálogo numerado de todas as estratégias testadas",diario:"O que o agente fez",plano:"Conclusões, plano e ideias"};
function render(){
  S.route=(location.hash.slice(1)||"inicio"); if(!VIEWS[S.route]) S.route="inicio";
  renderNav();
  const lab=ROUTES.find(r=>r[0]===S.route)[1];
  document.getElementById("ttl").innerHTML=`${lab}<span class="sub">${SUBS[S.route]}</span>`;
  document.getElementById("pfCtl").style.display=["testes","diario","plano"].includes(S.route)?"none":"";
  if(!S.data){document.getElementById("view").innerHTML=`<div class="card"><div class="empty">A carregar dados…</div></div>`; return;}
  const L=portfolios(); document.getElementById("pfSel").innerHTML=L.map(p=>`<option value="${p.id}" ${p.id===(curPf()||{}).id?"selected":""}>${esc(pfName(p))}</option>`).join("");
  document.getElementById("acc").value=S.acc;
  hideTip();
  try{ document.getElementById("view").innerHTML=VIEWS[S.route](); }
  catch(e){ console.error(e); document.getElementById("view").innerHTML=`<div class="card"><div class="empty">Erro a mostrar esta secção: ${esc(e.message)}</div></div>`; }
}
window.addEventListener("hashchange",()=>{render(); window.scrollTo({top:0});});

function nextRun(){const now=new Date(); const lis=new Date(now.toLocaleString("en-US",{timeZone:"Europe/Lisbon"}));
  for(let k=1;k<=24;k++){const t=new Date(lis.getTime()+k*36e5); const h=t.getHours(); if(h>=19||h<=3) return pad(h)+":00";} return "19:00";}
function status(log){
  const dot=document.getElementById("dot"), txt=document.getElementById("stTxt");
  const last=log[0]; const ago=last?(Date.now()-Date.parse(last.at))/6e4:1e9;
  const started=log.find(e=>e.kind==="inicio"), ended=log.find(e=>e.kind==="fim"||e.kind==="erro");
  const running=started&&(!ended||Date.parse(started.at)>Date.parse(ended.at))&&ago<45;
  const when=last?new Date(last.at).toLocaleString("pt-PT",{dateStyle:"short",timeStyle:"short"}):"";
  if(running){dot.className="dot live"; txt.innerHTML=`<b>Agente a trabalhar</b> · ${esc(last.message)}`;}
  else if(last&&last.kind==="erro"&&ago<720){dot.className="dot err"; txt.innerHTML=`<b>Parou com erro</b> · ${esc(last.message)}`;}
  else {dot.className="dot"; txt.innerHTML=`<b>Agente em pausa</b> · próxima corrida às ${nextRun()}${last?` · última atividade ${when}`:""}`;}
}
function load(){
  Promise.all([q("runs?select=*&order=created_at.desc"),q("state?select=key,value,updated_at"),q("agent_log?select=*&order=at.desc&limit=300")])
  .then(([runs,state,log])=>{
    const st=Object.fromEntries(state.map(r=>[r.key,r.value]));
    S.data={runs,log,todo:st.todo||[],summary:st.summary||"",holdoutLog:st.holdout_log||"",ideas:st.ideas||"",portfolio:st.portfolio||null,
      extra:Object.keys(st).filter(k=>k.startsWith("portfolio_")).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(k=>({label:k.slice(10),...st[k]}))};
    status(log); render();
  }).catch(e=>{document.getElementById("stTxt").textContent="Erro a carregar dados: "+e;});
}
(function(){const t=store("bt_theme"); if(t){document.documentElement.setAttribute("data-theme",t); document.getElementById("theme").value=t;}})();
render(); load(); setInterval(load,120000);
window.load=load;
</script>
